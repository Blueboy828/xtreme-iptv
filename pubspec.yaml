name: xtreme_iptv
description: A production-ready Android IPTV app powered by Xtream Codes API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Network
  dio: ^5.4.0
  connectivity_plus: ^6.0.0

  # Dependency Injection
  get_it: ^7.6.7
  injectable: ^2.3.2

  # Navigation
  go_router: ^13.0.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # JSON
  json_annotation: ^4.8.1

  # Functional programming
  dartz: ^0.10.1

  # Video player
  media_kit: ^1.1.10
  media_kit_video: ^1.0.10
  media_kit_libs_android_video: ^1.3.6

  # UI
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.19.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # Logging
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  injectable_generator: ^2.4.1
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  mocktail: ^1.0.3

  # App icon + splash screen generators
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

# ── App Icon Configuration ──────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: false
  # Flat, edge-to-edge icon (blue bg + emblem, no text) — used for
  # legacy Android and as the base icon Fire TV falls back to.
  image_path: "assets/images/xtreme_icon_flat.png"
  min_sdk_android: 21
  # Adaptive icon (Android 8+): solid red bg + transparent emblem-only
  # foreground, sized inside the safe zone so no launcher mask clips it.
  adaptive_icon_background: "#9B0000"
  adaptive_icon_foreground: "assets/images/xtreme_icon_foreground.png"

# ── Splash Screen Configuration ────────────────────────────────
flutter_native_splash:
  color: "#9B0000"
  image: "assets/images/xtreme_logo.png"
  android_12:
    image: "assets/images/xtreme_logo.png"
    color: "#9B0000"
  android: true
  ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
